<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HERRAR POWER SOLUTION</title>
  <script>
    (function () {
      const supportedLanguages = ['de', 'en', 'fr'];
      const storageKey = 'hpsPreferredLanguage';

      const normalizeLanguage = (languageValue) => {
        if (!languageValue) {
          return null;
        }

        const baseLanguage = String(languageValue).toLowerCase().split('-')[0];
        return supportedLanguages.includes(baseLanguage) ? baseLanguage : null;
      };

      const getStoredLanguage = () => {
        try {
          return normalizeLanguage(localStorage.getItem(storageKey));
        } catch (error) {
          return null;
        }
      };

      const getBrowserLanguage = () => {
        const browserLanguages = Array.isArray(navigator.languages) && navigator.languages.length > 0
          ? navigator.languages
          : [navigator.language];

        for (const languageValue of browserLanguages) {
          const normalizedLanguage = normalizeLanguage(languageValue);
          if (normalizedLanguage) {
            return normalizedLanguage;
          }
        }

        return 'en';
      };

      const isRootPath = window.location.pathname === '/' || window.location.pathname === '/index.html';
      if (!isRootPath) {
        return;
      }

      const targetLanguage = getStoredLanguage() || getBrowserLanguage() || 'en';
      window.location.replace(`/${targetLanguage}/`);
    })();
  </script>
</head>
<body>
  <noscript>
    <p>
      JavaScript is required for automatic language detection.
      Continue to the English site: <a href="./en/">/en/</a>
    </p>
  </noscript>
</body>
</html>
